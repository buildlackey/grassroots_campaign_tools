<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <style>
        <?!= include('FilterDialogCSS') ?>
    </style>
</head>
<body>
<!-- Header -->
<div class="dialog-header">
    <span class="dialog-title">
      <span class="icon-container">
        <?!= include('filter_icon') ?>
      </span>
      Filter by Distance
    </span>
</div>

<!-- Address entry -->
<label for="address">Address:</label>
<input id="address" type="text" placeholder="Type ahead…" autocomplete="off">

<!-- Distance slider -->
<label for="distance">Max Distance (miles):</label>
<input type="range" id="distance" min="1" max="100" value="10" oninput="updateSlider(this.value)">
<div>Selected: <span id="distanceVal">10</span> miles</div>

<!-- Entries grid -->
<div class="entries-grid">
    <div class="entries-label">Entries</div>
    <div class="entries-row">
        <span class="entry-icon">◯</span>
        <span class="entry-name">Total</span>
        <input id="totalEntries" type="text" readonly>
    </div>
    <div class="entries-row">
        <span class="entry-icon">✅</span>
        <span class="entry-name">Geolocated</span>
        <input id="geoEntries" type="text" readonly>
    </div>
    <div class="entries-row">
        <span class="entry-icon">❌</span>
        <span class="entry-name">Errored</span>
        <input id="errorEntries" type="text" readonly>
    </div>
</div>
</body>
</html>
