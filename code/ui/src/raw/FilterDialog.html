<!-- Custom header -->
<div class="dialog-header">
  <span class="dialog-title">
    <?!= include('EarthFunnelIcon') ?>
      Filter by Distance
    <span class="help-icon info"
          data-help="
            <div style='max-width:300px; text-align:left;'>
              <ul style='padding-left:16px; margin:0;'>
                <li>Enter a starting address and maximum distance.</li>
                <li>Only rows with geolocated addresses within that distance will be shown.</li>
                <li>See the 'Entries' panel for a breakdown of results.</li>
              </ul>
            </div>
          ">
      ?
    </span>
  </span>
</div>

<!-- Address entry -->
<label for="address">
    Address:
    <span class="help-icon info"
          data-help="This is the starting address for distance filtering. Rows will be compared to this location.">?</span>
</label>
<input id="address" type="text" placeholder="Type ahead…" autocomplete="off">

<!-- Distance slider -->
<label for="distance">
    Max Distance (miles):
    <span class="help-icon info"
          data-help="Adjust this slider to set the maximum distance in miles from the starting address.">?</span>
</label>
<input type="range" id="distance" min="1" max="100" value="10" oninput="updateSlider(this.value)">
<div>Selected: <span id="distanceVal">10</span> miles</div>

<!-- Entries grid -->
<div class="entries-grid">
    <div class="entries-label">
        Entries
        <span class="help-icon info"
              data-help="This section summarizes how many rows were processed, geolocated successfully, or failed.">?</span>
    </div>
    <div class="entries-row">
        <span class="entry-icon">◯</span>
        <span class="entry-name">Total</span>
        <input id="totalEntries" type="text" readonly
               title="Total number of rows scanned for addresses" />
    </div>
    <div class="entries-row">
        <span class="entry-icon">✅</span>
        <span class="entry-name">Geolocated</span>
        <input id="geoEntries" type="text" readonly
               title="Number of rows with valid geocoded addresses" />
    </div>
    <div class="entries-row">
        <span class="entry-icon">❌</span>
        <span class="entry-name">Errored</span>
        <input id="errorEntries" type="text" readonly
               title="Number of rows that could not be geolocated" />
    </div>
</div>
