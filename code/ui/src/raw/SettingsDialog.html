<!DOCTYPE html>
<html>
  <head>
    <base target="_top">

    <!-- jQuery & jQuery UI -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

    <style>
      /* Tight container + no horizontal scroll */
      html, body { overflow-x: hidden; }
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        width: auto;           /* let it size naturally */
        max-width: 420px;      /* keep the dialog compact */
        box-sizing: border-box;
        position: relative;
      }

      label {
        display: block;
        margin: 10px 0 5px;
      }

      input[type="text"],
      input[type="password"],
      select {
        width: 100%;
        max-width: 320px;      /* ~39 chars + small buffer */
        padding: 6px;
        font-size: 14px;
        box-sizing: border-box;
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        margin: 8px 0;
      }

      .checkbox-group input[type="checkbox"] {
        margin-right: 8px;
        flex-shrink: 0;
      }

      .checkbox-group label {
        margin: 0;
        white-space: nowrap;
      }

      /* Help icon style (tooltip target) */
      .help-icon {
        display: inline-block;
        font-size: 12px;
        width: 15px;
        height: 15px;
        text-align: center;
        line-height: 14px;
        border-radius: 50%;
        background: #e0f0ff;
        color: #2a7ddf;
        cursor: help;
        user-select: none;
        vertical-align: top;
        margin-left: 6px;
      }

      /* Ensure tooltip text can wrap and isn't clipped */
      .ui-tooltip {
        max-width: 300px;
        white-space: normal;
        z-index: 10000;
      }

      /* Button row styling */
      .button-row {
        display: flex;
        justify-content: flex-end; /* align to inputs' right edge */
        align-items: center;
        gap: 4mm;                  /* ~4 mm between buttons */
        margin-top: 8mm;
        width: 100%;
        max-width: 320px;          /* same cap as inputs so edges line up */
      }

      /* Equal size and padding for both buttons */
      .button-row button {
        padding: 6px 16px;
        min-width: 90px;           /* ensures equal width */
        box-sizing: border-box;
      }
    </style>

    <script>
      function initTooltips() {
        $(".help-icon").tooltip({
          items: ".help-icon",
          content: function () {
            return $(this).attr("data-help");
          },
          position: {
            my: "center bottom-10",
            at: "center top",
            collision: "flipfit"
          },
          tooltipClass: "custom-tooltip",
          track: true,
          open: function (event, ui) {
            // Keep tooltip open when mouse enters it
            ui.tooltip.on("mouseenter", function () {
              $(this).stop(true).fadeTo(200, 1); // Keep visible
            }).on("mouseleave", function () {
              $(this).fadeOut(200);
            });
          }
        }).on("mouseleave", function () {
          // Delay hide to allow moving into tooltip
          const tooltip = $(this).tooltip("instance")._tooltip;
          setTimeout(() => {
            if (!tooltip.is(":hover")) {
              $(this).tooltip("close");
            }
          }, 200);
        });
      }

      $(function () {
        initTooltips();
      });
    </script>
  </head>
