<!DOCTYPE html>
<html>
  <head>
    <base target="_top">

    <!-- jQuery & jQuery UI -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

    <style>
      /* Tight container + no horizontal scroll */
      html, body { overflow-x: hidden; }
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        width: auto;           /* let it size naturally */
        max-width: 420px;      /* keep the dialog compact */
        box-sizing: border-box;
        position: relative;
      }

      label {
        display: block;
        margin: 10px 0 5px;
      }

      input[type="text"],
      input[type="password"],
      select {
        width: 100%;
        max-width: 320px;      /* ~39 chars + small buffer */
        padding: 6px;
        font-size: 14px;
        box-sizing: border-box;
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        margin: 8px 0;
      }

      .checkbox-group input[type="checkbox"] {
        margin-right: 8px;
        flex-shrink: 0;
      }

      .checkbox-group label {
        margin: 0;
        white-space: nowrap;
      }

      /* ===== Help icon base (tooltip target) ===== */
      .help-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        width: 15px; /* default size (info) */
        height: 15px;
        text-align: center;
        line-height: 14px;
        border-radius: 50%;
        cursor: help;
        user-select: none;
        vertical-align: top;
        margin-left: 6px;
        position: relative; /* anchor for CSS tooltips if needed */
      }

      /* Blue info style (for "?") */
      .help-icon.info {
        background: #e0f0ff;
        color: #2a7ddf;
        border: 1px solid #cfe3ff;
        font-weight: bold;
      }

      /* Yellow caution style (SVG triangle) */
      .help-icon.caution {
        background: transparent;
        color: inherit;
        border: none;
        border-radius: 0;
        width: 18px;
        height: 18px;
        padding: 0;
      }
      .help-icon.caution svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Keyboard focus hint */
      .help-icon:focus {
        outline: 2px solid #d39e00;
        outline-offset: 2px;
      }

      /* Ensure tooltip text can wrap and isn't clipped */
      .ui-tooltip {
        max-width: 300px;
        white-space: normal;
        z-index: 2147483647; /* above Sheets & GAS chrome */
      }

      /* Button row styling */
      .button-row {
        display: flex;
        justify-content: flex-end; /* align to inputs' right edge */
        align-items: center;
        gap: 4mm;                  /* ~4 mm between buttons */
        margin-top: 8mm;
        width: 100%;
        max-width: 320px;
      }

      /* Equal size and padding for both buttons */
      .button-row button {
        padding: 6px 16px;
        min-width: 90px;
        box-sizing: border-box;
      }

      /* ===== Toast styles ===== */
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #323232;
        color: #fff;
        padding: 10px 20px;
        border-radius: 4px;
        z-index: 2147483647;
        font-size: 14px;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }
      .toast.show { opacity: 1; }
    </style>

    <script>
      (function () {
        function initTooltips() {
          var $container = $("#settings-dialog-container").length
            ? $("#settings-dialog-container") : $(document.body);

          $(".help-icon").tooltip({
            appendTo: $container,
            items: ".help-icon",
            content: function () { return $(this).attr("data-help"); },
            position: {
              my: "left+8 center",
              at: "right center",
              within: $container,
              collision: "fit flipfit"
            },
            tooltipClass: "custom-tooltip",
            track: false
          }).on("mouseleave", function () {
            const $el = $(this);
            setTimeout(function () { if ($el.tooltip) $el.tooltip("close"); }, 150);
          });
        }

        function waitForTooltipReady(maxMs, intervalMs) {
          var start = Date.now();
          (function tick() {
            if (window.jQuery && $.fn && $.fn.tooltip) { initTooltips(); return; }
            if (Date.now() - start >= maxMs) return;
            setTimeout(tick, intervalMs);
          })();
        }

        window.addEventListener("load", function () {
          waitForTooltipReady(5000, 50);
        });
      })();
    </script>
  </head>

  <body>
    <label for="mapsApiKey">
      Maps API Key:
      <span
        class="help-icon caution"
        tabindex="0"
        role="img"
        aria-label="Maps API key required"
        data-help='⚠ Enter your Google Maps API <strong>carefully</strong> (we do not yet check for validity). To verify the Maps JavaScript API is enabled and to view your key, go here: <a href="https://console.cloud.google.com/apis/library/maps-backend.googleapis.com" target="_blank">Google Cloud Console</a>'>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <polygon points="12,2 22,20 2,20"
                   fill="#fff3cd"
                   stroke="#d39e00"
                   stroke-width="2"
                   stroke-linejoin="round"/>
          <rect x="11" y="8" width="2" height="7" fill="#7a5a00"/>
          <circle cx="12" cy="17.5" r="1.3" fill="#7a5a00"/>
        </svg>
      </span>
    </label>
    <input id="mapsApiKey" type="text" />

    <div class="checkbox-group">
      <input type="checkbox" id="showApiKey">
      <label for="showApiKey">Show API Key</label>
    </div>

    <label for="sheetSelect">
      Sheet Tab:
      <span class="help-icon info" 
            data-help="Select the sheet tab where your data is stored. (Typically 'Sheet1' for new sheets)">?</span>
    </label>
    <select id="sheetSelect"></select>

    <label for="addressSelect">
      Address Column:
      <span class="help-icon info" 
            data-help="Choose the column that contains addresses for the selected sheet tab.">?</span>
    </label>
    <select id="addressSelect"></select>

    <div class="checkbox-group">
      <input type="checkbox" id="showLatLng">
      <label for="showLatLng">
        Show Lat/Lng columns
        <span class="help-icon info" 
              data-help="If enabled, Latitude and Longitude columns will be shown/filled in your sheet.">?</span>
      </label>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="debug">
      <label for="debug">
        Enable Debug Logging
        <span class="help-icon info" 
              data-help="Enable verbose logging to help troubleshoot issues.">?</span>

    </div>

    <div class="button-row">
      <button id="saveBtn" disabled>Save</button>
    </div>

    <script>

    </script>
  </body>
</html>
